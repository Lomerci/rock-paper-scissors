<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock-Paper-Scissors</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <h2>The player</h2>
        <div class="button">
            <button id="rock" class="playBtn"><i class="fa-regular fa-hand-back-fist"></i></button>
            <button id="paper" class="playBtn"><i class="fa-regular fa-hand"></i></button>
            <button id="scissors" class="playBtn"><i class="fa-regular fa-hand-scissors"></i></button>
        </div>
        <h2>The computer</h2>
        <div class="computer-container">
            <button id="rock-bot" class="playBtn"><i class="fa-regular fa-hand-back-fist"></i></button>
            <button id="paper-bot" class="playBtn"><i class="fa-regular fa-hand"></i></button>
            <button id="scissors-bot" class="playBtn"><i class="fa-regular fa-hand-scissors"></i></button>
        </div>
    </div>
</body>
</html>
