<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <h2>Player's Choice</h2>
        <div class="button-container">
            <button id="rock" class="playBtn"><i class="fa-regular fa-hand-back-fist"></i></button>
            <button id="paper" class="playBtn"><i class="fa-regular fa-hand"></i></button>
            <button id="scissors" class="playBtn"><i class="fa-regular fa-hand-scissors"></i></button>
        </div>
        <h2>Computer's Choice</h2>
        <div class="computer-container">
            <div id="rock-bot" class="botBtn"><i class="fa-regular fa-hand-back-fist"></i></div>
            <div id="paper-bot" class="botBtn"><i class="fa-regular fa-hand"></i></div>
            <div id="scissors-bot" class="botBtn"><i class="fa-regular fa-hand-scissors"></i></div>
        </div>
        <div id="result"></div>
    </div>
</body>
</html>
